name: schema-and-regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-and-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas-and-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.11"
          python-version: "3.12"
      - name: Run v1 schema & regression corpus unit tests and byte-identical checks
        run: |
          python3 -m unittest discover -s ci -p "test_*.py" -v
          python3 ci/export_benchmark_v1.py --check
          python3 ci/export_regression_corpus.py --check
      - name: Verify committed real-workload corpus digests cleanly against PerfDigest-MCP 1.2.0 and 1.3.0
        run: |
          uvx --python 3.12 --from perfdigest-mcp==1.2.0 --with mcp==1.27.2 python ci/digest_check.py \
            ninja-log:results/cpp_build_loop_raw/cold.ninja_log \
            cmake-profile:results/cpp_build_loop_raw/configure_cold.cmake-profile.json \
            cmake-profile:results/cpp_build_loop_raw/configure_warm.cmake-profile.json \
            ninja-log:results/cpp_build_loop_raw/incremental.ninja_log \
            clang-time-trace:results/cpp_build_loop_raw/template_heavy.ftime-trace.json \
            ptxas-verbose:results/cuda_opt_bench_raw/ptxas_verbose.txt
          uvx --python 3.12 --from perfdigest-mcp==1.3.0 python ci/digest_check.py \
            ninja-log:results/cpp_build_loop_raw/cold.ninja_log \
            cmake-profile:results/cpp_build_loop_raw/configure_cold.cmake-profile.json \
            cmake-profile:results/cpp_build_loop_raw/configure_warm.cmake-profile.json \
            ninja-log:results/cpp_build_loop_raw/incremental.ninja_log \
            clang-time-trace:results/cpp_build_loop_raw/template_heavy.ftime-trace.json \
            ptxas-verbose:results/cuda_opt_bench_raw/ptxas_verbose.txt
